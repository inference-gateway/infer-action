name: "Infer Agent Action"
description: "Run Infer CLI agent on GitHub issues with support for multiple AI providers, automatic pull request creation, and progress tracking"
author: "Inference Gateway"

branding:
  icon: "cpu"
  color: "blue"

inputs:
  github-token:
    description: "GitHub token for posting comments and accessing API"
    required: true

  github-app-slug:
    description: |
      Slug of the GitHub App whose bot identity should author the agent's
      commits (e.g. "infer-bot"). When set, commits are attributed to
      "<slug>[bot]" and the numeric id is taken from `github-app-user-id` if
      provided, otherwise resolved via GET /users/{slug}[bot] (which works with
      an App installation token, unlike GET /user). Falls back to
      github-actions[bot] when empty or if the id cannot be resolved.
    required: false
    default: ""

  github-app-user-id:
    description: |
      Numeric user id of the GitHub App bot ("<slug>[bot]"). When set, it is
      used directly to build the commit author email, skipping the
      GET /users/{slug}[bot] lookup. Prefer passing this from a step that has
      already resolved it (the reusable workflow does), so commit attribution
      does not depend on a second, flaky API call.
    required: false
    default: ""

  trigger-phrase:
    description: "Phrase to trigger the agent (e.g., @infer)"
    required: false
    default: "@infer"

  direct-prompt:
    description: |
      Free-text task to run directly, bypassing issue/comment trigger
      detection. When non-empty, the agent runs against this text instead of
      an issue or comment body, so the action works under `workflow_dispatch`
      (or any event) with no issue/PR thread required. In this mode the agent
      commits to a new branch and opens a PR (honoring `enable-git-operations`),
      and the result plus PR link are written to the job summary. A `/model`
      override embedded in the text is honored, as in event-driven mode. Leave
      empty (the default) for normal issue/comment-triggered behavior.
    required: false
    default: ""

  model:
    description: "Model to use (e.g., anthropic/claude-opus-4-8, openai/gpt-5, google/gemini-3-pro)."
    required: true

  version:
    description: |
      Infer CLI version to install (default: v0.163.0)
    required: false
    default: "v0.163.0"

  # BEGIN generated: provider-inputs (regenerate: task generate)
  ollama-cloud-api-key:
    description: "Ollama Cloud API key (required if using Ollama Cloud models)"
    required: false

  groq-api-key:
    description: "Groq API key (required if using Groq models)"
    required: false

  llamacpp-api-key:
    description: "llama.cpp API key (optional; set to the same value as the server's --api-key, leave unset for open servers)"
    required: false

  openai-api-key:
    description: "OpenAI API key (required if using OpenAI models)"
    required: false

  cloudflare-api-key:
    description: "Cloudflare API key (required if using Cloudflare models)"
    required: false

  cohere-api-key:
    description: "Cohere API key (required if using Cohere models)"
    required: false

  anthropic-api-key:
    description: "Anthropic API key (required if using Anthropic models)"
    required: false

  deepseek-api-key:
    description: "DeepSeek API key (required if using DeepSeek models)"
    required: false

  google-api-key:
    description: "Google API key (required if using Google/Gemini models)"
    required: false

  mistral-api-key:
    description: "Mistral API key (required if using Mistral models)"
    required: false

  minimax-api-key:
    description: "MiniMax API key (required if using MiniMax models)"
    required: false

  moonshot-api-key:
    description: "Moonshot API key (required if using Moonshot models)"
    required: false

  nvidia-api-key:
    description: "Nvidia API key (required if using Nvidia models)"
    required: false

  zai-api-key:
    description: "Zai API key (required if using Zai models)"
    required: false

  llamacpp-api-url:
    description: "llama.cpp API URL (required if using llama.cpp models)"
    required: false

  ollama-api-url:
    description: "Ollama API URL (required if using Ollama models)"
    required: false
  # END generated: provider-inputs

  max-turns:
    description: "Maximum number of agent iterations (default: 150)"
    required: false
    default: "150"

  custom-instructions:
    description: "Custom instructions to append to the default agent instructions (which include plan creation, progress tracking, file changes, and PR workflow)"
    required: false
    default: ""

  system-prompt-issue:
    description: |
      Override the bundled system prompt for issue triggers (issue opened/edited
      or comments on real issues). Substitutes `{{issueNumber}}`. Leave empty to
      use the default at src/prompts/system-issue.md in the action repo.

      This REPLACES (not merges with) the action's bundled default prompt.
      Whichever prompt results (override or bundled) replaces the CLI's own
      base system prompt text, while the CLI still appends its dynamic context
      block (skills, memory, tools, sandbox and bash allow-list info) because
      the action pins `INFER_AGENT_SYSTEM_PROMPT_WITH_DEFAULTS=true`.

      The bundled default carries the branch-first / commit-per-todo / push /
      draft-PR / finish-checklist git-safety block. If your override omits those
      instructions the action emits a `::warning::` in the run log so the
      lost-work guard isn't dropped silently. Prefer `custom-instructions` to
      layer extras on top of the default unless you need a full replacement.
    required: false
    default: ""

  system-prompt-pr:
    description: |
      Override the bundled system prompt for PR-comment triggers on same-repo
      PRs. Substitutes `{{prNumber}}`, `{{headRef}}`. Leave empty to use the
      default at src/prompts/system-pr.md in the action repo.

      This REPLACES (not merges with) the action's bundled default prompt.
      Whichever prompt results (override or bundled) replaces the CLI's own
      base system prompt text, while the CLI still appends its dynamic context
      block (skills, memory, tools, sandbox and bash allow-list info) because
      the action pins `INFER_AGENT_SYSTEM_PROMPT_WITH_DEFAULTS=true`.

      The bundled default carries the commit/push discipline and the "no [ahead"
      finish check. If your override omits those instructions the action emits a
      `::warning::` in the run log. Prefer `custom-instructions` to layer extras
      on top of the default.
    required: false
    default: ""

  system-prompt-pr-fork:
    description: |
      Override the bundled system prompt for PR-comment triggers on fork PRs
      (view-only). Substitutes `{{prNumber}}`, `{{headRef}}`,
      `{{headRepoFullName}}`, `{{baseRef}}`. Leave empty to use the default.

      This REPLACES (not merges with) the action's bundled default prompt.
      Whichever prompt results (override or bundled) replaces the CLI's own
      base system prompt text, while the CLI still appends its dynamic context
      block (skills, memory, tools, sandbox and bash allow-list info) because
      the action pins `INFER_AGENT_SYSTEM_PROMPT_WITH_DEFAULTS=true`.

      The bundled default's git-safety guard is the explicit do-not-commit /
      do-not-push prohibition. If your override omits those instructions the
      action emits a `::warning::` in the run log. Prefer `custom-instructions`
      to layer extras on top of the default.
    required: false
    default: ""

  system-prompt-direct:
    description: |
      Override the bundled system prompt for direct-prompt
      (`workflow_dispatch`) runs. No variables. Leave empty to use the default
      at src/prompts/system-direct.md in the action repo.

      This REPLACES (not merges with) the action's bundled default prompt.
      Whichever prompt results (override or bundled) replaces the CLI's own
      base system prompt text, while the CLI still appends its dynamic context
      block (skills, memory, tools, sandbox and bash allow-list info) because
      the action pins `INFER_AGENT_SYSTEM_PROMPT_WITH_DEFAULTS=true`.

      The bundled default carries the branch-first / commit-per-todo / push /
      draft-PR / finish-checklist git-safety block. If your override omits those
      instructions the action emits a `::warning::` in the run log so the
      lost-work guard isn't dropped silently. Prefer `custom-instructions` to
      layer extras on top of the default unless you need a full replacement.
    required: false
    default: ""

  reminders-config:
    description: |
      Verbatim reminders YAML passed to the CLI via INFER_REMINDERS_CONFIG,
      REPLACING the action's composed default. Use this to take full control of
      the CLI's native reminders system (hooks, triggers, cadences, custom
      nudges) for power-user scenarios the composed default doesn't cover.

      The composed default sets `merge: true`, layering a per-context reminder
      (pre_stream, interval), a `turns_before_max` wrap-up near the turn limit,
      and a post_tool `on_failure` nudge (fires only after a failed tool call on
      writable runs) onto the CLI's built-in defaults - so the built-in
      todo-hygiene and memory reminders stay intact. A non-empty
      reminders-config replaces the composed default entirely; add
      `merge: true` to your own config to keep the CLI built-ins, or omit it to
      replace them.

      See the Infer CLI `config/reminders.go` for the schema: top-level
      `enabled:` + optional `merge:` + a `reminders:` list of `{name, hook,
      trigger, interval?, threshold?, text}` entries. Hook points: pre_session,
      pre_stream, post_stream, pre_tool, post_tool, pre_queue_drain,
      post_queue_drain, post_session. Triggers: always, interval,
      turns_before_max, once, on_failure (on_failure requires hook: post_tool).
      Needs CLI >= v0.130.0. Leave empty to use the composed default.
    required: false
    default: ""

  task-issue:
    description: |
      Override the bundled task template for issue triggers. Substitutes
      `{{issueNumber}}`, `{{issueTitle}}`, `{{issueBody}}`,
      `{{triggeringCommentSection}}`. Leave empty to use the default.
    required: false
    default: ""

  task-pr:
    description: |
      Override the bundled task template for PR-comment triggers. Substitutes
      `{{prNumber}}`, `{{prTitle}}`, `{{headRef}}`, `{{baseRef}}`,
      `{{forkNotice}}`, `{{prBody}}`, `{{triggerSection}}`,
      `{{otherCommentsSection}}`, `{{diffStatSection}}`. Leave empty to use the
      default.
    required: false
    default: ""

  task-direct:
    description: |
      Override the bundled task template for direct-prompt runs. Substitutes
      `{{prompt}}`. Leave empty to use the default.
    required: false
    default: ""

  bash-allow-append:
    description: |
      Comma/newline-separated Go regex entries appended to the Infer CLI's read-only bash
      allow-list in every agent mode (maps to INFER_TOOLS_BASH_ALLOW_APPEND). The CLI owns the
      read-only baseline - file reads, read-only git/gh, and `gh project` (list/view/item-list/
      field-list) - so you no longer pass those. When git operations are enabled the action
      additionally appends the writes its PR workflow needs (git add/commit/push/checkout/
      switch/fetch and `gh pr create`; never `gh pr merge`/`close`/`edit`/`review`). Use this
      input to add project tooling. Each entry is anchored to the WHOLE command, so include
      arguments explicitly, e.g. "npm( .*)?,pnpm( .*)?,go test( .*)?". To *replace* the baseline
      (rather than append) configure the CLI's .infer/config.yaml directly.
    required: false
    default: ""

  web-fetch-domains:
    description: |
      Comma-separated list of domains the WebFetch tool may fetch from. The action passes this
      to the CLI as the INFER_TOOLS_WEB_FETCH_ALLOWED_DOMAINS env var (which maps to
      tools.web_fetch.allowed_domains and takes precedence over the config file), REPLACING the
      CLI default. Leave empty to use the action default
      "github.com,raw.githubusercontent.com,api.github.com,private-user-images.githubusercontent.com,objects.githubusercontent.com,user-images.githubusercontent.com"
      (the githubusercontent hosts are where github.com/user-attachments image links redirect,
      so the agent can WebFetch-download screenshots embedded in issues and PRs).
    required: false
    default: ""

  vision-model:
    description: |
      provider/model reference of a vision-capable model for the Infer CLI's image annotator,
      e.g. "anthropic/claude-haiku-4-5-20251001" (maps to INFER_VISION_ANNOTATOR_MODEL and sets
      INFER_VISION_ANNOTATOR_ENABLED=true). When set, the ImageDecode tool is registered so the
      agent can understand images embedded in issues/PRs (screenshots, diagrams) regardless of
      whether the session model has vision - it downloads the image with WebFetch and reads it
      via a side-call to this model. The model's provider API key must be passed to the action.
      Leave empty (the default) to keep image understanding off. Requires Infer CLI >= v0.159.0.
    required: false
    default: ""

  image-model:
    description: |
      provider/model reference used by the ImageGeneration/ImageEdit/ImageVariation tools' one-off
      requests to the gateway's /v1/images/* endpoints (maps to INFER_TOOLS_IMAGE_GENERATION_MODEL,
      INFER_TOOLS_IMAGE_EDIT_MODEL and INFER_TOOLS_IMAGE_VARIATION_MODEL). Leave empty to keep the
      CLI default ("openai/gpt-image-2", which needs OPENAI_API_KEY). The tools themselves are
      enabled by default in the CLI; generated images land in .infer/tmp and surface via the
      run-artifacts upload and the result comment's image embedding.
    required: false
    default: ""

  memory-repo:
    description: |
      Git remote URL backing the agent's persistent cross-run memory (ssh or https, e.g.
      "git@github.com:my-org/agent-memory.git" or "https://github.com/my-org/agent-memory").
      When set, the action enables the Infer CLI's memory git backend (maps to
      INFER_MEMORY_ENABLED=true, INFER_MEMORY_BACKEND_TYPE=git and
      INFER_MEMORY_BACKEND_GIT_REPO): the CLI pulls memory on run start and commits + pushes
      when a fact changes. Leave empty (the default) to keep the feature off entirely - no
      memory env vars are set, so a consumer's own .infer/memory.yaml is untouched. Requires
      Infer CLI >= v0.127.0. See also memory-deploy-key / memory-token for auth.
    required: false
    default: ""

  memory-branch:
    description: |
      Branch of memory-repo to sync (maps to INFER_MEMORY_BACKEND_GIT_BRANCH). Leave empty to
      use the CLI default ("main"). Only used when memory-repo is set.
    required: false
    default: ""

  memory-sync-on-start:
    description: |
      Whether the CLI pulls the memory repo at run start: "pull" or "off" (maps to
      INFER_MEMORY_BACKEND_GIT_SYNC_ON_START). Leave empty to use the CLI default ("pull").
      Only used when memory-repo is set.
    required: false
    default: ""

  memory-sync-on-finish:
    description: |
      Whether the CLI pushes memory changes at run finish: "push" or "off" (maps to
      INFER_MEMORY_BACKEND_GIT_SYNC_ON_FINISH). Leave empty to use the CLI default ("push").
      Only used when memory-repo is set.
    required: false
    default: ""

  memory-deploy-key:
    description: |
      SSH private key (e.g. a GitHub deploy key with write access) used to authenticate the
      memory-repo remote when it is an ssh URL. Written to ~/.ssh/infer-memory-deploy-key and
      wired via core.sshCommand before the agent runs; removed again in cleanup. Only used
      when memory-repo is an ssh URL.
    required: false
    default: ""

  memory-token:
    description: |
      Token used to authenticate the memory-repo remote when it is an https URL (applied as a
      git insteadOf rewrite scoped to that repo; removed again in cleanup). When memory-repo
      is an https URL on this GitHub instance and neither memory-token nor memory-deploy-key
      is set, the action falls back to github-token - which only works for repos that token
      can write, e.g. a memory branch of the workflow repo itself.
    required: false
    default: ""

  review-inline:
    description: |-
      When true and the run is in review mode, post findings as a real GitHub
      pull request review with inline, line-anchored comments (including
      suggestion blocks the PR author can apply with one click), instead of a
      single conversation comment. Default: false.
    required: false
    default: "false"

  enable-git-operations:
    description: "Enable git operations (checkout, add, commit, push). Default: true. Set to false if you want the agent to only post comments without creating PRs."
    required: false
    default: "true"

  enable-heuristic-redaction:
    description: "Apply regex heuristics to redact unknown token shapes (ghp_*, github_pat_*, sk-*, AIza*, xox[bpoa]-*, and JWTs) from the cooking comment and step summary, on top of the known-value redaction that always runs. May false-positive on legitimate strings. Default: false."
    required: false
    default: "false"

  mirror-agent-logs:
    description: |-
      Mirror the agent's verbose stdout transcript to this step's workflow log.
      When true, every line the agent emits on stdout - tool inputs, outputs,
      file contents, web-fetch payloads - appears in the Actions run log.
      Leave empty (the default) to follow the `debug` input: a debug run
      mirrors, a normal run stays quiet. Set "false" to keep stdout muted even
      with `debug: true`, or "true" to mirror regardless of debug. The agent's
      stderr (crashes, panics, stack-traces) is always mirrored so failures
      stay visible, and the /tmp/agent-output.txt file that post-results reads
      for the cooking comment footer is always written - both regardless of
      this setting. A minimal heartbeat (ticker updates, exit code) still
      prints so the step isn't entirely silent. Note the transcript is raw -
      only registered secrets are masked. Default: "" (follows debug).
    required: false
    default: ""

  no-color:
    description: |-
      Disable colored output from Infer CLI commands (traces, stats, etc.).
      Passes --no-colors to the CLI and sets NO_COLOR=1 in the environment.
      Useful when the agent's result comment contains raw ANSI escape sequences
      (mojibake) from piped command output. Default: false.
    required: false
    default: "false"

  show-footer:
    description: |-
      Show the result footer in the cooking comment. When false, the entire
      result section (status header, agent response, metadata, token usage,
      cost, tool-call stats, traces, logs, and the attribution line) is
      omitted from the comment. The step summary and action outputs (exit-code,
      result, pr-url, etc.) are still written regardless. Default: true.

      Note: traces, stats (metrics), and logs sections within the footer are
      additionally gated behind the `debug` input - they only appear when both
      `show-footer: true` and `debug: true` are set. This saves input tokens
      in normal operation.
    required: false
    default: "true"

  upload-artifacts:
    description: |-
      Collect files the agent left in the Infer tmp directories (.infer/tmp in
      the workspace and ~/.infer/tmp - where the CLI's WebFetch saves downloads
      and binary content) after the run, upload them as a GitHub Actions run
      artifact (infer-artifacts-<run_id>), and render an Artifacts section in
      the result comment. Images are embedded inline (pushed to the repo's
      infer-artifacts branch so they can render; on private repos or when the
      push fails they fall back to the file list). Other files are listed with
      the run-artifact download link. Only files matching artifact-extensions
      are collected; skipped silently when nothing matches. Default: true.
    required: false
    default: "true"

  artifact-extensions:
    description: |-
      Comma-separated, case-insensitive list of file extensions eligible for
      collection when upload-artifacts is enabled.
      Default: png,jpg,jpeg,gif,webp,svg,txt,md,csv,json,log,html,pdf
    required: false
    default: "png,jpg,jpeg,gif,webp,svg,txt,md,csv,json,log,html,pdf"

  skills:
    description: |
      Newline-separated list of Infer skills to install before the agent runs.
      Each entry is passed to `infer skills install`. Lines starting with `#` are
      treated as comments. When non-empty, skills are auto-enabled for the agent
      (INFER_AGENT_SKILLS_ENABLED=true).

      Accepted entry forms (per `infer skills install --help`):
        - Bare skill name:    maintainer
            -> https://github.com/inference-gateway/skills/tree/main/skills/maintainer
        - <org>/<skill> pair: acme/internal-comms
            -> https://github.com/acme/skills/tree/main/skills/internal-comms
        - Full GitHub URL:    https://github.com/anthropics/skills/tree/main/skills/pdf

      Examples:
        skills: maintainer

        skills: |
          maintainer
          acme/internal-comms

        skills: |
          # first-party
          maintainer
          # custom layout / pinned branch
          https://github.com/my-org/agent-bundles/tree/v1.2/skills/triage
    required: false
    default: ""

  skills-discovery:
    description: |
      Enable catalog skill discovery, where the agent sees the full published
      skill catalog and downloads a skill on demand when a prompt names it.
      Defaults to true. When true, sets INFER_AGENT_SKILLS_ENABLED=true so the
      agent loads the catalog index (one cached HTTP GET per process) and
      includes a bounded prompt block (default 4000 chars) listing available
      skills.

      SECURITY: In headless CI mode a named skill downloads with no approval
      gate, since there is nobody to ask. On public repositories the prompt
      text comes from third-party issue/comment bodies. A comment naming a
      skill causes the runner to fetch that skill's instructions from the
      configured skills-repository. The model cannot trigger this on its own;
      the trigger is always human-authored prompt text. Set to false to
      disable catalog discovery entirely.

      Requires Infer CLI >= v0.156.1 (the default version pin). Earlier
      releases lack the bounded prompt block and may regress token cost on
      large catalogs.
    required: false
    default: "true"

  skills-repository:
    description: |
      GitHub repository hosting the skill catalog (default:
      inference-gateway/skills). Redirects the install shorthand, on-demand
      downloads, and the catalog index in one setting, so a private fork
      works without touching anything else. Maps to
      INFER_AGENT_SKILLS_REPOSITORY.

      Example for a private fork:
        skills-repository: my-org/private-skills
    required: false
    default: "inference-gateway/skills"

  plugins:
    description: |
      Newline-separated list of Infer plugins to install before the agent runs.
      Each entry is passed to `infer plugins install`. Lines starting with `#`
      are treated as comments. Blank lines are ignored.

      Accepted entry forms (per `infer plugins install --help`):
        - owner/repo:          DietrichGebert/ponytail
        - owner/repo@ref:      DietrichGebert/ponytail@v1.0.0
        - Full GitHub URL:     https://github.com/DietrichGebert/ponytail
                              or https://github.com/DietrichGebert/ponytail/tree/v1.0.0

      Each entry is installed with `--yes` (non-interactive). A failing install
      fails the step with a log line naming the entry.

      Security model: plugins are content-only mapping (skills + instructions).
      Plugin code (hooks/, commands/, agents/) is detected but never executed
      or installed by the CLI. See the Infer CLI documentation for details.

      Examples:
        plugins: DietrichGebert/ponytail

        plugins: |
          DietrichGebert/ponytail
          my-org/my-plugin@v2.1.0

        plugins: |
          # community plugin
          DietrichGebert/ponytail
          # pinned ref
          https://github.com/my-org/agent-plugins/tree/v1.0
    required: false
    default: ""

  agents:
    description: |
      Comma/newline-separated list of A2A (Agent-to-Agent) agents to spin up as
      local Docker containers when the agent runs. Each entry is one of:

        - A first-party agent name the CLI already knows - `browser-agent`,
          `mock-agent`, `google-calendar-agent`, `documentation-agent`, or
          `n8n-agent`. The CLI fills in the OCI image and localhost URL itself.
        - A `name:tag` pair to select a specific OCI image tag for a first-party
          agent, e.g. `browser-agent:lightpanda`. Maps to `infer agents add
          <name> --tag <tag>`.
        - A `name=oci-image` pair to register a custom image, e.g.
          `my-agent=ghcr.io/my-org/my-agent:latest`.

      Lines starting with `#` are treated as comments. For each entry the action
      runs `infer agents add ... --run --model <model>` (writing the local
      `.infer/agents.yaml`, which is hidden from git), enables it, and turns on
      A2A (`INFER_A2A_ENABLED=true`) so `infer agent` starts the containers and
      exposes them to the model via the A2A tools. Agents default to the same
      `model` as the main run; configure `.infer/agents.yaml` directly for
      per-agent models. Registration is best-effort: an unknown name or a failed
      add logs a warning and is skipped rather than failing the run.

      Docker must be available on the runner (the default `ubuntu-24.04` runner
      has it pre-installed). This is an advanced, experimental feature.

      Examples:
        agents: browser-agent

        agents: |
          browser-agent
          documentation-agent

        agents: |
          # first-party agent with tag
          browser-agent:lightpanda
          # custom image
          my-agent=ghcr.io/my-org/my-agent:latest
    required: false
    default: ""

  debug:
    description: |
      Enable debug-level logging in the Infer CLI, emit diagnostic stream
      events (system reminder injections, conversation compaction triggers),
      and mirror the agent's stdout transcript to this step's workflow log
      (unless `mirror-agent-logs` is explicitly set to "false"). Hidden by
      default. Turn on when investigating why the agent ignored its system
      prompt or whether reminders are firing.
    required: false
    default: "false"

  compact-auto-at:
    description: |
      Auto-compaction threshold as a percentage of the model's context window.
      When the conversation's input tokens cross this percent, the CLI runs an
      LLM-summarised compaction that drops older turns while preserving the
      first messages. Default 50. Lower to compact earlier (preserves headroom
      at the cost of summarised context), raise to delay summarisation.
      Accepted range 20-100.
    required: false
    default: "50"

  mock-agent-scenario:
    description: |
      Which mock scenario the bundled mock agent runs when dry-run is true. One of:
        - happy           Three TodoWrite passes + Read + a commit on a fix/ branch (exercises PR-link)
        - failures        Happy path with interspersed envelope and inner tool-call failures
        - no-todos        Agent does work but never calls TodoWrite
        - empty           Agent exits immediately with no tool calls
        - incomplete      Agent is cut off mid-plan (stopped-early signal)
        - no-git          Agent edits files but never commits/pushes (salvage from a dirty tree)
        - commit-no-push  Agent commits on the fix branch but never pushes, exits 0 (salvage of unpushed commits)
        - hang            Agent wedges inside compaction and never exits (timeout/cancel path)
    required: false
    default: "happy"

  dry-run:
    description: |
      Plan-only mode for local testing (e.g. with `act`). Forces the bundled
      mock agent (no real CLI install, no provider tokens), and SIMULATES every
      GitHub mutation - comments, the eyes reaction, the cooking comment, comment
      zone updates, spinner clear - printing a `[dry-run] would ...` line instead
      of calling the API. The runner also prints a "DRY RUN" banner with the exact
      SYSTEM/TASK/REMINDER prompts and tool whitelists the agent would receive.
      GitHub READ calls still execute (so you see the real target issue/PR), and
      degrade gracefully when no token is available.
    required: false
    default: "false"

  otel-exporter-otlp-endpoint:
    description: |
      OpenTelemetry OTLP HTTP endpoint for telemetry export
      (e.g. http://localhost:4318). When empty (the default), no OTel env vars
      are set and the CLI does not export telemetry. Passed through to the
      `infer` CLI subprocess as the OTEL_EXPORTER_OTLP_ENDPOINT env var - the
      CLI emits metrics, traces, and logs natively from real internal signals.
    required: false
    default: ""

  otel-exporter-otlp-headers:
    description: |
      Comma-separated key=value headers for the OTLP HTTP requests
      (e.g. "Authorization=Bearer my-token"). These are secret and auto-masked.
      Passed through to the `infer` CLI subprocess as the
      OTEL_EXPORTER_OTLP_HEADERS env var.
    required: false
    default: ""

  otel-service-name:
    description: |
      Value for the service.name resource attribute on exported telemetry.
      Defaults to "infer-action". Passed through to the `infer` CLI subprocess
      as the OTEL_SERVICE_NAME env var.
    required: false
    default: "infer-action"

  otel-resource-attributes:
    description: |
      Extra resource attributes in key=val,key2=val2 format, appended to the
      standard set the CLI emits. Passed through to the `infer` CLI subprocess
      as the OTEL_RESOURCE_ATTRIBUTES env var. The CLI also adds GitHub Actions
      context (actor, repo, run id, workflow url) automatically.
    required: false
    default: ""

  otel-collector:
    description: |
      Deploy a temporary OpenTelemetry collector (Docker, host network) for the
      duration of the job. The infer CLI, the in-job gateway, and A2A agent
      containers all push OTLP traces/metrics/logs to it, and it fans traces
      back to the CLI's local receiver so the report footer's `infer traces`
      shows the full distributed tree (including a2a.request sub-spans). When
      otel-exporter-otlp-endpoint is also set, the collector forwards all
      signals to that remote with otel-exporter-otlp-headers attached.
      Requires Docker on the runner (Linux); torn down in cleanup.
      Enabled by default; best-effort - never fails the run (a missing Docker
      or a failed collector start warns and the run continues without it).
      Set to "false" to skip the collector entirely.
    required: false
    default: "true"

outputs:
  result:
    description: "Result of the agent execution"
    value: ${{ steps.report.outputs.result }}

  exit-code:
    description: "Exit code from agent command (normalised to 0 on a job-timeout stop, where the work is recovered into a draft PR)"
    value: ${{ steps.report.outputs.exit-code }}

  pr-url:
    description: "URL of the pull request the agent opened on its branch, or the draft PR the salvage step opened when an interrupted run left work unpushed (empty if none)"
    value: ${{ steps.report.outputs.pr-url }}

  run-duration-ms:
    description: "Wall-clock duration of the agent run in milliseconds (0 if unavailable)"
    value: ${{ steps.report.outputs.run-duration-ms }}

  stopped-early:
    description: "true if the agent stopped before finishing its plan (unfinished todos, uncommitted work left behind, or a job-timeout stop)"
    value: ${{ steps.report.outputs.stopped-early }}

  timed-out:
    description: "true if the agent was stopped because the job hit its timeout-minutes before it finished (work is recovered into a draft PR; reported as ⚠️ stopped early, not a failure)"
    value: ${{ steps.report.outputs.timed-out }}

  failed-tool-calls-count:
    description: "Number of failed tool calls detected in agent output"
    value: ${{ steps.report.outputs.failed-count }}

  total-tool-calls-count:
    description: "Total number of tool calls made by the agent"
    value: ${{ steps.report.outputs.total-count }}

runs:
  using: "composite"
  steps:
    - name: Check trigger conditions
      id: check-trigger
      shell: bash
      run: |
        TRIGGERED=false
        TRIGGER_PHRASE="${{ inputs.trigger-phrase }}"
        MODEL_OVERRIDE=""

        regex_escape() {
          local str="$1"
          printf '%s' "$str" | sed 's/[.[\*^$+?{|()\\]/\\&/g'
        }
        ESCAPED_PHRASE=$(regex_escape "$TRIGGER_PHRASE")
        WHOLE_WORD_PATTERN="(^|[^[:alnum:]_])${ESCAPED_PHRASE}([^[:alnum:]_]|$)"

        # Review mode. Two ways to ask for review-only (feedback, no edits):
        #   1. An explicit "/review" slash command anywhere in the request.
        #   2. The trigger phrase + "review" as the request's verb, directly or
        #      after a politeness/modal filler ("please", "can you", ...).
        # Matches "@infer /review", "@infer review this", "@infer can you review
        # this?"; does NOT match "review" as a later noun behind a change verb
        # ("@infer fix the review comments") or a path ("src/review/x") - those
        # must still edit.
        REVIEW_MODE=false
        REVIEW_PATTERN="${ESCAPED_PHRASE}([^[:alnum:]_]+(please|pls|plz|kindly|can|could|would|will|you|u))*[^[:alnum:]_]+review([^[:alnum:]_]|$)"
        REVIEW_SLASH_PATTERN="(^|[^[:alnum:]_])/review([^[:alnum:]_]|$)"
        detect_review_mode() {
          local rc
          shopt -s nocasematch
          { [[ "$1" =~ $REVIEW_PATTERN ]] || [[ "$1" =~ $REVIEW_SLASH_PATTERN ]]; } && rc=0 || rc=1
          shopt -u nocasematch
          return $rc
        }

        extract_model_override() {
          local text="$1"
          if [[ "$text" =~ /model[[:space:]]+([a-zA-Z0-9/_.:-]+) ]]; then
            echo "${BASH_REMATCH[1]}"
          fi
        }

        DIRECT_PROMPT=$(cat <<'DIRECT_PROMPT_EOF'
        ${{ inputs.direct-prompt }}
        DIRECT_PROMPT_EOF
        )
        if [[ -n "$(printf '%s' "$DIRECT_PROMPT" | tr -d '[:space:]')" ]]; then
          echo "Direct prompt provided; running in direct (workflow_dispatch) mode."
          MODEL_OVERRIDE=$(extract_model_override "$DIRECT_PROMPT")
          if [[ -n "$MODEL_OVERRIDE" ]]; then
            echo "Detected model override from direct prompt: $MODEL_OVERRIDE"
          fi
          if detect_review_mode "$DIRECT_PROMPT"; then REVIEW_MODE=true; fi
          echo "context_kind=direct" >> $GITHUB_OUTPUT
          echo "model_override=$MODEL_OVERRIDE" >> $GITHUB_OUTPUT
          echo "review_mode=$REVIEW_MODE" >> $GITHUB_OUTPUT
          echo "triggered=true" >> $GITHUB_OUTPUT
          exit 0
        fi

        if [[ "${{ github.event_name }}" == "issues" ]]; then
          ISSUE_TITLE=$(cat <<'ISSUE_TITLE_EOF'
        ${{ github.event.issue.title }}
        ISSUE_TITLE_EOF
        )
          ISSUE_BODY=$(cat <<'ISSUE_BODY_EOF'
        ${{ github.event.issue.body }}
        ISSUE_BODY_EOF
        )

          if [[ "$ISSUE_TITLE" =~ $WHOLE_WORD_PATTERN ]] || [[ "$ISSUE_BODY" =~ $WHOLE_WORD_PATTERN ]]; then
            TRIGGERED=true
            if detect_review_mode "$ISSUE_BODY" || detect_review_mode "$ISSUE_TITLE"; then REVIEW_MODE=true; fi
            MODEL_OVERRIDE=$(extract_model_override "$ISSUE_BODY")
            if [[ -n "$MODEL_OVERRIDE" ]]; then
              echo "Detected model override from issue body: $MODEL_OVERRIDE"
            fi
          fi
        fi

        if [[ "${{ github.event_name }}" == "issue_comment" || "${{ github.event_name }}" == "pull_request_review_comment" ]]; then
          COMMENT_AUTHOR="${{ github.event.comment.user.login }}"

          if [[ "$COMMENT_AUTHOR" == *"[bot]" ]] || [[ "${{ github.event.comment.user.type }}" == "Bot" ]]; then
            echo "Comment is from bot user '$COMMENT_AUTHOR'. Skipping to prevent recursion."
            TRIGGERED=false
          else
            COMMENT_BODY=$(cat <<'COMMENT_BODY_EOF'
        ${{ github.event.comment.body }}
        COMMENT_BODY_EOF
        )
            COMMENT_ID="${{ github.event.comment.id }}"

            if [[ "$COMMENT_BODY" =~ $WHOLE_WORD_PATTERN ]]; then
              TRIGGERED=true
              if detect_review_mode "$COMMENT_BODY"; then REVIEW_MODE=true; fi
              echo "comment_id=$COMMENT_ID" >> $GITHUB_OUTPUT
              MODEL_OVERRIDE=$(extract_model_override "$COMMENT_BODY")
              if [[ -n "$MODEL_OVERRIDE" ]]; then
                echo "Detected model override: $MODEL_OVERRIDE"
              fi
            fi
          fi
        fi

        CONTEXT_KIND="issue"
        if [[ "${{ github.event_name }}" == "issue_comment" && -n "${{ github.event.issue.pull_request.url }}" ]]; then
          CONTEXT_KIND="pull_request"
        fi
        if [[ "${{ github.event_name }}" == "pull_request_review_comment" ]]; then
          CONTEXT_KIND="pull_request"
        fi

        echo "context_kind=$CONTEXT_KIND" >> $GITHUB_OUTPUT
        echo "model_override=$MODEL_OVERRIDE" >> $GITHUB_OUTPUT
        echo "review_mode=$REVIEW_MODE" >> $GITHUB_OUTPUT
        echo "triggered=$TRIGGERED" >> $GITHUB_OUTPUT

        if [[ "$REVIEW_MODE" == "true" ]]; then
          echo "Review mode: code-mutating tools (Edit/Write/Delete) will be disabled for this run."
        fi

        if [[ "$TRIGGERED" == "false" ]]; then
          echo "Trigger phrase '$TRIGGER_PHRASE' not found. Skipping action."
          exit 0
        fi

        echo "Trigger phrase '$TRIGGER_PHRASE' detected. Proceeding with agent execution."

    - name: Add eyes emoji reaction to comment
      if: steps.check-trigger.outputs.triggered == 'true' && (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment')
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        DRY_RUN: ${{ inputs.dry-run }}
      run: |
        COMMENT_ID="${{ steps.check-trigger.outputs.comment_id }}"
        REPO="${{ github.repository }}"

        # Review (inline diff) comments live under the pulls namespace.
        COMMENT_KIND="issues"
        if [[ "${{ github.event_name }}" == "pull_request_review_comment" ]]; then
          COMMENT_KIND="pulls"
        fi

        if [[ "$DRY_RUN" == "true" ]]; then
          echo "[dry-run] would add 'eyes' reaction to $COMMENT_KIND comment #$COMMENT_ID on $REPO"
          exit 0
        fi

        curl -X POST \
          -H "Authorization: Bearer $GITHUB_TOKEN" \
          -H "Accept: application/vnd.github.v3+json" \
          "https://api.github.com/repos/$REPO/$COMMENT_KIND/comments/$COMMENT_ID/reactions" \
          -d '{"content":"eyes"}'

        echo "Added eyes emoji reaction to comment #$COMMENT_ID"

    - name: Post initial cooking message
      id: cooking-message
      if: steps.check-trigger.outputs.triggered == 'true' && steps.check-trigger.outputs.context_kind != 'direct'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        DRY_RUN: ${{ inputs.dry-run }}
        MODEL: ${{ steps.check-trigger.outputs.model_override || inputs.model }}
      run: |
        ISSUE_NUMBER="${{ github.event.issue.number || github.event.pull_request.number }}"
        REPO="${{ github.repository }}"
        COMMENT_ID="${{ steps.check-trigger.outputs.comment_id }}"

        if [[ "${{ github.event_name }}" == "pull_request_review_comment" ]]; then
          echo "cooking_comment_is_review=true" >> $GITHUB_OUTPUT
        fi

        if [[ "$DRY_RUN" == "true" ]]; then
          if [[ "${{ github.event_name }}" == "pull_request_review_comment" ]]; then
            echo "[dry-run] would create the 'I'\''m cooking...' review comment reply on PR #$ISSUE_NUMBER in reply to #$COMMENT_ID"
          else
            PRIOR=$(curl -s \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/$REPO/issues/$ISSUE_NUMBER/comments" 2>/dev/null \
              | jq -r '[.[] | select(.body != null and (.body | contains("I'\''m cooking")))] | length' 2>/dev/null || echo 0)
            [[ -z "$PRIOR" || "$PRIOR" == "null" ]] && PRIOR=0
            echo "[dry-run] would delete $PRIOR prior 'I'\''m cooking' comment(s) on issue #$ISSUE_NUMBER"
            echo "[dry-run] would create the 'I'\''m cooking...' comment on issue #$ISSUE_NUMBER (https://github.com/$REPO/issues/$ISSUE_NUMBER)"
          fi
          echo "cooking_comment_id=999999999" >> $GITHUB_OUTPUT
          echo "[dry-run] using synthetic cooking_comment_id=999999999 so downstream steps exercise their update paths"
          exit 0
        fi

        COOKING_MESSAGE="<!-- infer:spinner --><img src=\"https://raw.githubusercontent.com/inference-gateway/infer-action/main/assets/spinner.svg\" width=\"22\" height=\"22\" alt=\"Working\" /><!-- /infer:spinner -->

        **Model:** \`${MODEL}\` · [View Job](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

        I'm cooking...will get back to you soon..."

        COMMENT_BODY=$(jq -n \
          --arg body "$COOKING_MESSAGE" \
          '{body: $body}')

        if [[ "${{ github.event_name }}" == "pull_request_review_comment" ]]; then
          COMMENT_RESPONSE=$(curl -sf -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$REPO/pulls/$ISSUE_NUMBER/comments" \
            -d "$(jq -n --arg body "$COOKING_MESSAGE" --argjson in_reply_to "$COMMENT_ID" '{body: $body, in_reply_to: $in_reply_to}')") || {
            echo "Failed to post cooking review comment reply on PR #$ISSUE_NUMBER" >&2
            exit 1
          }
        else
          echo "Cleaning up old cooking messages..."
          curl -s \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$REPO/issues/$ISSUE_NUMBER/comments" \
            | jq -r '.[] | select(.body | contains("I'\''m cooking")) | .id' \
            | while read comment_id; do
                echo "Deleting old cooking message #$comment_id"
                curl -s -X DELETE \
                  -H "Authorization: Bearer $GITHUB_TOKEN" \
                  -H "Accept: application/vnd.github.v3+json" \
                  "https://api.github.com/repos/$REPO/issues/comments/$comment_id"
              done

          COMMENT_RESPONSE=$(curl -sf -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$REPO/issues/$ISSUE_NUMBER/comments" \
            -d "$COMMENT_BODY") || {
            echo "Failed to post cooking comment to issue #$ISSUE_NUMBER" >&2
            exit 1
          }
        fi

        COOKING_COMMENT_ID=$(echo "$COMMENT_RESPONSE" | jq -r '.id // empty')
        if [[ -z "$COOKING_COMMENT_ID" ]]; then
          echo "Failed to parse cooking_comment_id from response" >&2
          echo "Response was: $COMMENT_RESPONSE" >&2
          exit 1
        fi
        echo "cooking_comment_id=$COOKING_COMMENT_ID" >> $GITHUB_OUTPUT
        echo "Posted cooking message to $([ "${{ github.event_name }}" == "pull_request_review_comment" ] && echo "review comment thread on PR" || echo "issue") #$ISSUE_NUMBER (comment #$COOKING_COMMENT_ID)"

    - name: Install Infer CLI
      id: install-cli
      if: steps.check-trigger.outputs.triggered == 'true' && inputs.dry-run != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        VERSION="${{ inputs.version }}"
        if [[ -z "$VERSION" ]]; then
          VERSION=$(gh release view --repo inference-gateway/cli --json tagName --jq .tagName)
        fi
        case "${RUNNER_ARCH}" in
          ARM64) ARCH=arm64 ;;
          *) ARCH=amd64 ;;
        esac
        gh release download "$VERSION" --repo inference-gateway/cli \
          --pattern "infer-linux-${ARCH}" --output /usr/local/bin/infer --clobber
        chmod +x /usr/local/bin/infer
        infer version

    - name: Initialize Infer userspace config
      id: init-userspace
      if: steps.check-trigger.outputs.triggered == 'true' && inputs.dry-run != 'true'
      shell: bash
      run: |
        set -euo pipefail

        infer init

    - name: Hide Infer workspace from git
      id: hide-infer-workspace
      if: steps.check-trigger.outputs.triggered == 'true'
      shell: bash
      run: |
        set -uo pipefail

        # The CLI writes runtime state under .infer/ while the agent runs
        # (agents.yaml for A2A agents, conversations, logs). Keep those writes
        # out of the agent's `git add -A` so they never land in its commits or
        # trip the recover step's stopped-early dirty-tree check.
        if ! git rev-parse --git-dir >/dev/null 2>&1; then
          echo "Not a git repository; skipping .infer/ hide step."
          exit 0
        fi

        # Untracked consumer repos: exclude .infer/ locally so it is never staged.
        GIT_EXCLUDE="$(git rev-parse --git-path info/exclude 2>/dev/null || echo .git/info/exclude)"
        mkdir -p "$(dirname "$GIT_EXCLUDE")"
        if ! grep -qxF '.infer/' "$GIT_EXCLUDE" 2>/dev/null; then
          echo '.infer/' >> "$GIT_EXCLUDE"
          echo "Added .infer/ to $GIT_EXCLUDE"
        fi

        # Repos that track .infer/ (this action dogfooding itself): stop git from
        # seeing runtime modifications to those tracked files.
        TRACKED="$(git ls-files -z -- .infer/ 2>/dev/null || true)"
        if [[ -n "$TRACKED" ]]; then
          printf '%s' "$TRACKED" | xargs -0 -r git update-index --skip-worktree 2>/dev/null || true
          echo "Marked tracked .infer/ files skip-worktree"
        fi

    - name: Install Infer skills
      id: install-skills
      if: steps.check-trigger.outputs.triggered == 'true' && inputs.dry-run != 'true' && (inputs.skills != '' || inputs.skills-discovery == 'true')
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        set -e

        SKILLS_INPUT=$(cat <<'SKILLS_EOF'
        ${{ inputs.skills }}
        SKILLS_EOF
        )

        FILTERED=$(printf '%s\n' "$SKILLS_INPUT" \
          | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' \
          | grep -Ev '^([[:space:]]*$|#)' || true)

        if [[ -z "$FILTERED" ]]; then
          echo "No skills to install (input was empty after filtering comments and blanks)."
          if [[ "${{ inputs.skills-discovery }}" == "true" ]]; then
            echo "INFER_AGENT_SKILLS_ENABLED=true" >> $GITHUB_ENV
          fi
          exit 0
        fi

        while IFS= read -r entry; do
          [[ -z "$entry" ]] && continue
          echo "Installing skill: ${entry}"
          infer skills install "$entry" --user --overwrite
        done <<< "$FILTERED"

        echo ""
        echo "Discovered skills after install:"
        infer skills list

        echo "INFER_AGENT_SKILLS_ENABLED=true" >> $GITHUB_ENV

    - name: Install Infer plugins
      id: install-plugins
      if: steps.check-trigger.outputs.triggered == 'true' && inputs.dry-run != 'true' && inputs.plugins != ''
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        set -e

        PLUGINS_INPUT=$(cat <<'PLUGINS_EOF'
        ${{ inputs.plugins }}
        PLUGINS_EOF
        )

        FILTERED=$(printf '%s\n' "$PLUGINS_INPUT" \
          | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' \
          | grep -Ev '^([[:space:]]*$|#)' || true)

        if [[ -z "$FILTERED" ]]; then
          echo "No plugins to install (input was empty after filtering comments and blanks)."
          exit 0
        fi

        while IFS= read -r entry; do
          [[ -z "$entry" ]] && continue
          echo "Installing plugin: ${entry}"
          infer plugins install "$entry" --yes
        done <<< "$FILTERED"

        echo ""
        echo "Discovered plugins after install:"
        infer plugins list

    - name: Setup OpenTelemetry
      id: setup-otel
      if: steps.check-trigger.outputs.triggered == 'true' && inputs.dry-run != 'true' && (inputs.otel-collector == 'true' || inputs.otel-exporter-otlp-endpoint != '')
      shell: bash
      env:
        OTEL_COLLECTOR: ${{ inputs.otel-collector }}
        OTEL_REMOTE_ENDPOINT: ${{ inputs.otel-exporter-otlp-endpoint }}
        OTEL_REMOTE_HEADERS: ${{ inputs.otel-exporter-otlp-headers }}
      run: |
        set -o pipefail

        if [[ "$OTEL_COLLECTOR" != "true" ]]; then
          {
            echo "TELEMETRY_ENABLED=true"
            echo "TELEMETRY_TRACING_ENABLED=true"
            echo "TELEMETRY_TRACING_OTLP_ENDPOINT=${OTEL_REMOTE_ENDPOINT}"
            echo "OTEL_A2A_AGENTS_ENDPOINT=${OTEL_REMOTE_ENDPOINT}"
          } >> "$GITHUB_ENV"
          echo "Remote OTel fan-out configured: ${OTEL_REMOTE_ENDPOINT}"
          exit 0
        fi

        if ! command -v docker >/dev/null 2>&1; then
          echo "::warning::otel-collector requested but docker is unavailable; skipping the local collector."
          exit 0
        fi

        CFG="$RUNNER_TEMP/otel-collector.yaml"
        TRACE_SINKS="otlphttp/cli"
        OTHER_SINKS="debug"
        {
          cat <<'COLLECTOR_EOF'
        receivers:
          otlp:
            protocols:
              http:
                endpoint: 0.0.0.0:4318
        exporters:
          debug: {}
          otlphttp/cli:
            endpoint: http://localhost:4319
            retry_on_failure:
              enabled: true
        COLLECTOR_EOF
          if [[ -n "$OTEL_REMOTE_ENDPOINT" ]]; then
            echo "  otlphttp/remote:"
            echo "    endpoint: ${OTEL_REMOTE_ENDPOINT}"
            if [[ -n "$OTEL_REMOTE_HEADERS" ]]; then
              echo "    headers:"
              IFS=',' read -ra HDRS <<< "$OTEL_REMOTE_HEADERS"
              for h in "${HDRS[@]}"; do
                echo "      ${h%%=*}: \"${h#*=}\""
              done
            fi
            TRACE_SINKS="otlphttp/cli, otlphttp/remote"
            OTHER_SINKS="debug, otlphttp/remote"
          fi
          cat <<COLLECTOR_EOF
        service:
          pipelines:
            traces:
              receivers: [otlp]
              exporters: [${TRACE_SINKS}]
            metrics:
              receivers: [otlp]
              exporters: [${OTHER_SINKS}]
            logs:
              receivers: [otlp]
              exporters: [${OTHER_SINKS}]
        COLLECTOR_EOF
        } > "$CFG"

        if ! docker run -d --name infer-otel-collector --network host \
            -v "$CFG:/etc/otelcol-contrib/config.yaml:ro" \
            otel/opentelemetry-collector-contrib:0.130.0; then
          echo "::warning::failed to start the OTel collector; continuing without it."
          exit 0
        fi

        # Best-effort readiness: the OTLP HTTP port answers within ~15s.
        for _ in $(seq 1 30); do
          curl -s -o /dev/null http://localhost:4318 && break
          sleep 0.5
        done

        {
          echo "INFER_TELEMETRY_ENABLED=true"
          echo "INFER_TELEMETRY_OTLP_ENDPOINT=http://localhost:4318"
          echo "INFER_TELEMETRY_OTLP_INTERVAL=10"
          echo "INFER_TELEMETRY_RECEIVER_ADDRESS=127.0.0.1:4319"
          echo "TELEMETRY_ENABLED=true"
          echo "TELEMETRY_TRACING_ENABLED=true"
          echo "TELEMETRY_TRACING_OTLP_ENDPOINT=http://localhost:4318"
          echo "OTEL_A2A_AGENTS_ENDPOINT=http://172.17.0.1:4318"
        } >> "$GITHUB_ENV"
        echo "OTel collector started (host network, OTLP http :4318, fan-back :4319)"

    - name: Setup A2A agents
      id: setup-agents
      if: steps.check-trigger.outputs.triggered == 'true' && inputs.dry-run != 'true' && inputs.agents != ''
      shell: bash
      env:
        AGENT_MODEL: ${{ steps.check-trigger.outputs.model_override || inputs.model }}
        DEBUG: ${{ inputs.debug }}
      run: |
        set -o pipefail

        AGENTS_INPUT=$(cat <<'AGENTS_EOF'
        ${{ inputs.agents }}
        AGENTS_EOF
        )

        ENTRIES=$(printf '%s\n' "$AGENTS_INPUT" \
          | tr ',' '\n' \
          | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' \
          | grep -Ev '^([[:space:]]*$|#)' || true)

        if [[ -z "$ENTRIES" ]]; then
          echo "No agents to set up (input was empty after filtering)."
          exit 0
        fi

        if ! command -v docker >/dev/null 2>&1; then
          echo "::warning::docker not found on the runner - A2A agents run as local Docker containers and will not start. Registering their config anyway."
        fi

        trim() { local s="$1"; s="${s#"${s%%[![:space:]]*}"}"; s="${s%"${s##*[![:space:]]}"}"; printf '%s' "$s"; }

        ANY_ADDED=false
        CUSTOM_PORT=8090

        A2A_OTEL_FLAGS=()
        if [[ -n "${OTEL_A2A_AGENTS_ENDPOINT:-}" ]]; then
          A2A_OTEL_FLAGS=(
            --environment A2A_TELEMETRY_ENABLED=true
            --environment A2A_OTEL_TRACES_EXPORTER=otlp
            --environment "A2A_OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_A2A_AGENTS_ENDPOINT}"
            --environment A2A_OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
          )
        fi

        while IFS= read -r entry; do
          [[ -z "$entry" ]] && continue

          if [[ "$entry" == *"="* ]]; then
            AGENT_NAME="$(trim "${entry%%=*}")"
            AGENT_IMAGE="$(trim "${entry#*=}")"
            if [[ -z "$AGENT_NAME" || -z "$AGENT_IMAGE" ]]; then
              echo "::warning::malformed custom agent entry '$entry' (expected name=oci-image); skipping."
              continue
            fi
            echo "Registering custom A2A agent: $AGENT_NAME (image: $AGENT_IMAGE)"
            if infer agents add "$AGENT_NAME" "http://localhost:${CUSTOM_PORT}" --oci "$AGENT_IMAGE" --run --model "$AGENT_MODEL" "${A2A_OTEL_FLAGS[@]}"; then
              ANY_ADDED=true
              CUSTOM_PORT=$((CUSTOM_PORT + 1))
            else
              echo "::warning::failed to register custom agent '$AGENT_NAME'; skipping."
            fi
          elif [[ "$entry" == *":"* ]]; then
            AGENT_NAME="$(trim "${entry%%:*}")"
            AGENT_TAG="$(trim "${entry#*:}")"
            if [[ -z "$AGENT_NAME" || -z "$AGENT_TAG" ]]; then
              echo "::warning::malformed tagged agent entry '$entry' (expected name:tag); skipping."
              continue
            fi
            echo "Registering A2A agent: $AGENT_NAME (tag: $AGENT_TAG)"
            if infer agents add "$AGENT_NAME" --tag "$AGENT_TAG" --run --model "$AGENT_MODEL" "${A2A_OTEL_FLAGS[@]}"; then
              ANY_ADDED=true
            else
              echo "::warning::'$AGENT_NAME' is not a known first-party agent. Use NAME=OCI_IMAGE to register a custom image. Skipping."
            fi
          else
            AGENT_NAME="$entry"
            echo "Registering A2A agent: $AGENT_NAME"
            if infer agents add "$AGENT_NAME" --run --model "$AGENT_MODEL" "${A2A_OTEL_FLAGS[@]}"; then
              ANY_ADDED=true
            else
              echo "::warning::'$AGENT_NAME' is not a known first-party agent. Use NAME=OCI_IMAGE to register a custom image. Skipping."
            fi
          fi
        done <<< "$ENTRIES"

        if [[ "$ANY_ADDED" == "true" ]]; then
          echo "INFER_A2A_ENABLED=true" >> "$GITHUB_ENV"
          echo "INFER_A2A_TOOLS_SUBMIT_TASK_REQUIRE_APPROVAL=false" >> "$GITHUB_ENV"
          echo "INFER_A2A_TOOLS_QUERY_TASK_REQUIRE_APPROVAL=false" >> "$GITHUB_ENV"
          echo "INFER_A2A_TOOLS_QUERY_AGENT_REQUIRE_APPROVAL=false" >> "$GITHUB_ENV"
          echo "INFER_A2A_TASK_ARTIFACTS_AUTO_DOWNLOAD=true" >> "$GITHUB_ENV"
          echo ""
          echo "Configured A2A agents:"
          infer agents list || true

          if [[ "$DEBUG" == "true" ]] && command -v docker >/dev/null 2>&1; then
            AGENT_LOG_DIR="$RUNNER_TEMP/agent-logs"
            mkdir -p "$AGENT_LOG_DIR"
            (
              SEEN=" "
              while true; do
                for ID in $(docker ps -q --filter "name=inference-agent-" 2>/dev/null); do
                  [[ "$SEEN" == *" $ID "* ]] && continue
                  SEEN="$SEEN$ID "
                  NAME="$(docker inspect --format '{{.Name}}' "$ID" 2>/dev/null | sed 's|^/||')"
                  docker logs -f "$ID" >> "$AGENT_LOG_DIR/${NAME:-$ID}.log" 2>&1 &
                done
                sleep 2
              done
            ) >/dev/null 2>&1 &
            echo "Started A2A agent log capture (debug) -> $AGENT_LOG_DIR"
          fi
        else
          echo "No A2A agents were registered; leaving A2A disabled."
        fi

    - name: Configure Git
      id: configure-git
      if: steps.check-trigger.outputs.triggered == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        APP_SLUG: ${{ inputs.github-app-slug }}
        APP_USER_ID: ${{ inputs.github-app-user-id }}
      run: |
        set -euo pipefail

        BOT_LOGIN=""
        BOT_ID=""
        if [[ -n "${APP_SLUG:-}" ]]; then
          BOT_LOGIN="${APP_SLUG}[bot]"
          if [[ "${APP_USER_ID:-}" =~ ^[0-9]+$ ]]; then
            BOT_ID="$APP_USER_ID"
          else
            BOT_ID="$(gh api "/users/${APP_SLUG}[bot]" --jq '.id' || true)"
            if [[ ! "$BOT_ID" =~ ^[0-9]+$ ]]; then
              echo "::warning::Could not resolve id for ${APP_SLUG}[bot] (pass github-app-user-id to avoid this lookup); falling back to github-actions[bot]"
            fi
          fi
        fi

        if [[ -z "$BOT_LOGIN" || ! "$BOT_ID" =~ ^[0-9]+$ ]]; then
          BOT_LOGIN="github-actions[bot]"
          BOT_ID="41898282"
        fi

        git config --global user.name "$BOT_LOGIN"
        git config --global user.email "${BOT_ID}+${BOT_LOGIN}@users.noreply.github.com"

        BOT_EMAIL="${BOT_ID}+${BOT_LOGIN}@users.noreply.github.com"
        {
          echo "GIT_AUTHOR_NAME=${BOT_LOGIN}"
          echo "GIT_AUTHOR_EMAIL=${BOT_EMAIL}"
          echo "GIT_COMMITTER_NAME=${BOT_LOGIN}"
          echo "GIT_COMMITTER_EMAIL=${BOT_EMAIL}"
        } >> "$GITHUB_ENV"

        echo "Git configured for commits as ${BOT_LOGIN} (${BOT_ID})"

        if [[ -d .githooks ]]; then
          git config core.hooksPath .githooks
          echo "Enabled repo git hooks (core.hooksPath=.githooks)"
        fi

    - name: Set up persistent memory
      id: setup-memory
      if: steps.check-trigger.outputs.triggered == 'true' && inputs.memory-repo != '' && inputs.dry-run != 'true'
      shell: bash
      env:
        MEMORY_REPO: ${{ inputs.memory-repo }}
        MEMORY_BRANCH: ${{ inputs.memory-branch }}
        MEMORY_SYNC_ON_START: ${{ inputs.memory-sync-on-start }}
        MEMORY_SYNC_ON_FINISH: ${{ inputs.memory-sync-on-finish }}
        MEMORY_DEPLOY_KEY: ${{ inputs.memory-deploy-key }}
        MEMORY_TOKEN: ${{ inputs.memory-token }}
        GH_TOKEN: ${{ inputs.github-token }}
        SERVER_URL: ${{ github.server_url }}
      run: |
        set -euo pipefail

        case "${MEMORY_SYNC_ON_START:-}" in
          "" | pull | off) ;;
          *)
            echo "::error::memory-sync-on-start must be 'pull' or 'off' (got '${MEMORY_SYNC_ON_START}')"
            exit 1
            ;;
        esac
        case "${MEMORY_SYNC_ON_FINISH:-}" in
          "" | push | off) ;;
          *)
            echo "::error::memory-sync-on-finish must be 'push' or 'off' (got '${MEMORY_SYNC_ON_FINISH}')"
            exit 1
            ;;
        esac

        SCHEME=""
        HOST=""
        REPO_PATH=""
        if [[ "$MEMORY_REPO" =~ ^https://([^/]+)/(.+)$ ]]; then
          SCHEME="https"
          HOST="${BASH_REMATCH[1]}"
          REPO_PATH="${BASH_REMATCH[2]}"
        elif [[ "$MEMORY_REPO" =~ ^ssh://([^@/]+@)?([^:/]+)(:[0-9]+)?/.+$ ]]; then
          SCHEME="ssh"
          HOST="${BASH_REMATCH[2]}"
        elif [[ "$MEMORY_REPO" =~ ^[^@/]+@([^:/]+):.+$ ]]; then
          SCHEME="ssh"
          HOST="${BASH_REMATCH[1]}"
        else
          echo "::error::memory-repo '${MEMORY_REPO}' is not a recognized git URL (expected https://HOST/PATH, ssh://[user@]HOST/PATH or user@HOST:PATH)"
          exit 1
        fi

        {
          echo "INFER_MEMORY_ENABLED=true"
          echo "INFER_MEMORY_BACKEND_TYPE=git"
          echo "INFER_MEMORY_BACKEND_GIT_REPO=${MEMORY_REPO}"
        } >> "$GITHUB_ENV"
        [[ -n "${MEMORY_BRANCH:-}" ]] && echo "INFER_MEMORY_BACKEND_GIT_BRANCH=${MEMORY_BRANCH}" >> "$GITHUB_ENV"
        [[ -n "${MEMORY_SYNC_ON_START:-}" ]] && echo "INFER_MEMORY_BACKEND_GIT_SYNC_ON_START=${MEMORY_SYNC_ON_START}" >> "$GITHUB_ENV"
        [[ -n "${MEMORY_SYNC_ON_FINISH:-}" ]] && echo "INFER_MEMORY_BACKEND_GIT_SYNC_ON_FINISH=${MEMORY_SYNC_ON_FINISH}" >> "$GITHUB_ENV"

        if [[ "$SCHEME" == "ssh" ]]; then
          if [[ -n "${MEMORY_TOKEN:-}" ]]; then
            echo "::notice::memory-token is ignored because memory-repo is an ssh URL - use memory-deploy-key, or switch memory-repo to https."
          fi
          if [[ -z "${MEMORY_DEPLOY_KEY:-}" ]]; then
            echo "::warning::memory-repo is an ssh URL but memory-deploy-key is not set - memory sync will fail unless the runner already has ambient ssh credentials for ${HOST}."
          else
            mkdir -p "$HOME/.ssh"
            chmod 700 "$HOME/.ssh"
            KEY_FILE="$HOME/.ssh/infer-memory-deploy-key"
            printf '%s\n' "$MEMORY_DEPLOY_KEY" > "$KEY_FILE"
            chmod 600 "$KEY_FILE"
            ssh-keyscan -H "$HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null || true
            git config --global core.sshCommand "ssh -i ${KEY_FILE} -o IdentitiesOnly=yes"
            echo "Memory auth configured: ssh deploy key for ${HOST}"
          fi
        else
          if [[ -n "${MEMORY_DEPLOY_KEY:-}" ]]; then
            echo "::notice::memory-deploy-key is ignored because memory-repo is an https URL - use memory-token, or switch memory-repo to ssh."
          fi
          TOKEN="${MEMORY_TOKEN:-}"
          if [[ -z "$TOKEN" ]]; then
            SERVER_HOST="${SERVER_URL#https://}"
            SERVER_HOST="${SERVER_HOST#http://}"
            SERVER_HOST="${SERVER_HOST%%/*}"
            if [[ "$HOST" == "$SERVER_HOST" ]]; then
              TOKEN="$GH_TOKEN"
              echo "::notice::memory-repo has no memory-token - falling back to github-token. This only works for repos that token can write to, e.g. a memory branch of the workflow repo itself."
            else
              echo "::warning::memory-repo is set but no memory-token or memory-deploy-key is provided, and host '${HOST}' is not this GitHub instance - memory sync will fail unless the runner has ambient git credentials."
            fi
          fi
          if [[ -n "$TOKEN" ]]; then
            echo "::add-mask::${TOKEN}"
            git config --global "url.https://x-access-token:${TOKEN}@${HOST}/${REPO_PATH}.insteadOf" "https://${HOST}/${REPO_PATH}"
            echo "Memory auth configured: token rewrite for https://${HOST}/${REPO_PATH}"
          fi
        fi

        echo "Persistent memory enabled: ${MEMORY_REPO} (branch: ${MEMORY_BRANCH:-main})"

    - name: Setup Bun for action runtime
      if: steps.check-trigger.outputs.triggered == 'true'
      uses: oven-sh/setup-bun@v2.2.0
      with:
        bun-version: "1.3.13"

    - name: Print configuration summary
