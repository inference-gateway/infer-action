        MOCK_MAKE_COMMIT: ${{ (inputs.dry-run == 'true' && (inputs.mock-agent-scenario == 'happy' || inputs.mock-agent-scenario == 'commit-no-push')) && '1' || '0' }}
        # OTel env vars: passed through to the CLI subprocess so it emits telemetry natively
        OTEL_EXPORTER_OTLP_ENDPOINT: ${{ inputs.otel-exporter-otlp-endpoint }}
        OTEL_EXPORTER_OTLP_HEADERS: ${{ inputs.otel-exporter-otlp-headers }}
        OTEL_SERVICE_NAME: ${{ inputs.otel-service-name }}
        OTEL_RESOURCE_ATTRIBUTES: ${{ inputs.otel-resource-attributes }}
      run: exec bun "$GITHUB_ACTION_PATH/dist/runner/index.js"

    - name: Salvage unfinished work
      id: salvage
      if: steps.check-trigger.outputs.triggered == 'true' && always() && inputs.enable-git-operations == 'true' && steps.check-trigger.outputs.review_mode != 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        # BEGIN generated: provider-env (regenerate: task generate)
        OLLAMA_CLOUD_API_KEY: ${{ inputs.ollama-cloud-api-key }}
        GROQ_API_KEY: ${{ inputs.groq-api-key }}
        LLAMACPP_API_KEY: ${{ inputs.llamacpp-api-key }}
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        CLOUDFLARE_API_KEY: ${{ inputs.cloudflare-api-key }}
        COHERE_API_KEY: ${{ inputs.cohere-api-key }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        DEEPSEEK_API_KEY: ${{ inputs.deepseek-api-key }}
        GOOGLE_API_KEY: ${{ inputs.google-api-key }}
        MISTRAL_API_KEY: ${{ inputs.mistral-api-key }}
        MINIMAX_API_KEY: ${{ inputs.minimax-api-key }}
        MOONSHOT_API_KEY: ${{ inputs.moonshot-api-key }}
        NVIDIA_API_KEY: ${{ inputs.nvidia-api-key }}
        ZAI_API_KEY: ${{ inputs.zai-api-key }}
        LLAMACPP_API_URL: ${{ inputs.llamacpp-api-url }}
        OLLAMA_API_URL: ${{ inputs.ollama-api-url }}
        # END generated: provider-env
        MEMORY_TOKEN: ${{ inputs.memory-token }}
        MEMORY_DEPLOY_KEY: ${{ inputs.memory-deploy-key }}
        INFER_REDACT_HEURISTICS: ${{ inputs.enable-heuristic-redaction }}
        INFER_NO_COLOR: ${{ inputs.no-color }}
        INFER_DRY_RUN: ${{ inputs.dry-run }}
        INFER_REPO: ${{ github.repository }}
        INFER_ISSUE_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        INFER_ISSUE_TITLE: ${{ github.event.issue.title || github.event.pull_request.title }}
        INFER_ISSUE_BODY: ${{ github.event.issue.body || github.event.pull_request.body }}
        INFER_DIRECT_PROMPT: ${{ inputs.direct-prompt }}
        INFER_CONTEXT_KIND: ${{ steps.check-trigger.outputs.context_kind }}
        INFER_TRIGGERING_COMMENT_ID: ${{ steps.check-trigger.outputs.comment_id }}
        INFER_TRIGGERING_COMMENT_BODY: ${{ github.event.comment.body }}
        INFER_TRIGGERING_COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
        INFER_ENABLE_GIT_OPERATIONS: ${{ inputs.enable-git-operations }}
        INFER_RUN_AGENT_EXIT_CODE: ${{ steps.run-agent.outputs.exit-code }}
        INFER_LOGGING_DEBUG: ${{ inputs.debug }}
        INFER_MIRROR_AGENT_LOGS: ${{ inputs.mirror-agent-logs }}
      run: bun "$GITHUB_ACTION_PATH/dist/salvage/index.js"

    - name: Collect run artifacts
      id: collect-artifacts
      if: steps.check-trigger.outputs.triggered == 'true' && always() && inputs.upload-artifacts == 'true'
      shell: bash
      env:
        ARTIFACT_EXTENSIONS: ${{ inputs.artifact-extensions }}
      run: |
        STAGING="$RUNNER_TEMP/infer-artifacts"
        mkdir -p "$STAGING"

        FIND_ARGS=()
        IFS=',' read -ra EXTS <<< "$ARTIFACT_EXTENSIONS"
        for ext in "${EXTS[@]}"; do
          ext="$(echo "$ext" | tr -d '[:space:].')"
          [[ -z "$ext" ]] && continue
          if [[ ${#FIND_ARGS[@]} -gt 0 ]]; then FIND_ARGS+=(-o); fi
          FIND_ARGS+=(-iname "*.${ext}")
        done

        if [[ ${#FIND_ARGS[@]} -gt 0 ]]; then
          # Workspace tmp dir first, HOME second; first wins on name collisions.
          for dir in "$GITHUB_WORKSPACE/.infer/tmp" "$HOME/.infer/tmp"; do
            [[ -d "$dir" ]] || continue
            while IFS= read -r -d '' f; do
              cp -n "$f" "$STAGING/" 2>/dev/null || true
            done < <(find "$dir" -maxdepth 1 -type f \( "${FIND_ARGS[@]}" \) -print0 2>/dev/null)
          done
        fi

        COUNT="$(find "$STAGING" -type f | wc -l | tr -d ' ')"
        if [[ "$COUNT" -gt 0 ]]; then
          echo "Collected $COUNT artifact file(s) into $STAGING"
          echo "has-artifacts=true" >> "$GITHUB_OUTPUT"
        else
          echo "No artifact files found in the Infer tmp directories"
          echo "has-artifacts=false" >> "$GITHUB_OUTPUT"
        fi
        echo "dir=$STAGING" >> "$GITHUB_OUTPUT"

    - name: Upload run artifacts
      id: upload-artifacts
      if: steps.check-trigger.outputs.triggered == 'true' && always() && steps.collect-artifacts.outputs.has-artifacts == 'true' && inputs.dry-run != 'true'
      continue-on-error: true
      uses: actions/upload-artifact@v7.0.1
      with:
        name: infer-artifacts-${{ github.run_id }}
        path: ${{ steps.collect-artifacts.outputs.dir }}
        if-no-files-found: ignore

    - name: Report result
      id: report
      if: steps.check-trigger.outputs.triggered == 'true' && always()
      shell: bash
