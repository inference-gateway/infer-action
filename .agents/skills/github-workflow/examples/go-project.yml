# Go project: toolchain via the `languages` input and an allow-list derived from
# the repo's own scripts.
#
# `languages: go` installs the Go toolchain before the agent runs (respecting the
# version in `go.mod`). The `bash-allow-append` entries come from reading what the
# repository actually runs - its `Taskfile.yml`/`Makefile` targets and CI steps -
# not from a generic toolchain list: list only the commands your project's scripts
# invoke. Entries are Go regexes anchored to the whole command, so include
# arguments explicitly (e.g. `go( .*)?`).
#
# Copy this into `.github/workflows/` in your repo.
name: Infer Agent (Go)

on:
  issues:
    types:
      - opened
      - edited
  issue_comment:
    types:
      - created
  pull_request_review_comment:
    types:
      - created

permissions:
  issues: write
  contents: write
  pull-requests: write

jobs:
  infer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: arduino/setup-task@v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: inference-gateway/infer-action@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          model: deepseek/deepseek-v4-flash
          deepseek-api-key: ${{ secrets.DEEPSEEK_API_KEY }}
          languages: go
          bash-allow-append: "task( .*)?,go( .*)?,gofmt( .*)?,golangci-lint( .*)?"
