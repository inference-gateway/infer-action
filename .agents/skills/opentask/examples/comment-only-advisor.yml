# Advisory / comment-only mode (`enable-git-operations: false`).
#
# The agent analyzes the issue and replies, but never creates branches, commits,
# or pull requests - `git` and `gh` are withheld from its bash allow-list. Good
# for triage, review suggestions, and Q&A where you do not want code changes.
#
# Copy this into `.github/workflows/` in your repo.
name: OpenTask Advisor

on:
  issues:
    types:
      - opened
      - edited
  issue_comment:
    types:
      - created
  pull_request_review_comment:
    types:
      - created

permissions:
  issues: write # post the analysis comment
  contents: read # read the checkout; no writes needed

jobs:
  opentask:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/create-github-app-token@v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: inference-gateway/infer-action@main
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          github-app-slug: ${{ steps.app-token.outputs.app-slug }}
          model: deepseek/deepseek-v4-flash
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          enable-git-operations: false
