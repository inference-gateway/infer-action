name: Infer Agent (inline review)

# Whole-PR inline review (review-inline: true) needs a PR-context run:
#   - Trigger from the PR conversation - a PR conversation comment
#     (issue_comment) or a submitted review (pull_request_review) sets
#     context_kind=pull_request, which both the system prompt and the report
#     step require before a real PR review is submitted.
#   - Ask for review mode: "/review", or "review" as the verb right after the
#     trigger phrase (e.g. comment "@infer review this PR").
# A bare ping on an inline review comment (pull_request_review_comment) stays
# focused on its own thread, and direct-prompt runs (workflow_dispatch) have no
# PR context - review-inline is inert for both.

on:
  issue_comment:
    types:
      - created
  pull_request_review:
    types:
      - submitted
  pull_request_review_comment:
    types:
      - created

permissions:
  issues: write
  contents: write
  pull-requests: write

jobs:
  infer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/create-github-app-token@v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: inference-gateway/infer-action@main
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          github-app-slug: ${{ steps.app-token.outputs.app-slug }}
          model: ${{ vars.DEFAULT_MODEL }}
          review-inline: "true"
          llamacpp-api-url: ${{ secrets.LLAMACPP_API_URL }}
          llamacpp-api-key: ${{ secrets.LLAMACPP_API_KEY }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          google-api-key: ${{ secrets.GOOGLE_API_KEY }}
          deepseek-api-key: ${{ secrets.DEEPSEEK_API_KEY }}
          groq-api-key: ${{ secrets.GROQ_API_KEY }}
          mistral-api-key: ${{ secrets.MISTRAL_API_KEY }}
          cloudflare-api-key: ${{ secrets.CLOUDFLARE_API_KEY }}
          cohere-api-key: ${{ secrets.COHERE_API_KEY }}
          ollama-cloud-api-key: ${{ secrets.OLLAMA_CLOUD_API_KEY }}
          moonshot-api-key: ${{ secrets.MOONSHOT_API_KEY }}
          minimax-api-key: ${{ secrets.MINIMAX_API_KEY }}
          nvidia-api-key: ${{ secrets.NVIDIA_API_KEY }}
          zai-api-key: ${{ secrets.ZAI_API_KEY }}
