# Rust project (here: a Tauri app with a Bun-built frontend): `languages` +
# `apt` inputs, a pre-build step, and a script-derived allow-list.
#
# `languages: rust` installs the Rust toolchain before the agent runs, and `apt:`
# installs the native libraries the crate links against (cached across runs).
# The pre-build step runs the frontend build once up front so the agent doesn't
# have to repeat it on every task - drop it if your repo has no such step.
# The `bash-allow-append` entries mirror what the repository's own
# `Taskfile.yml`/CI actually runs: list only those commands, anchored as Go
# regexes over the whole command (e.g. `cargo( .*)?`).
#
# Copy this into `.github/workflows/` in your repo.
name: Infer Agent (Rust)

on:
  issues:
    types:
      - opened
      - edited
  issue_comment:
    types:
      - created
  pull_request_review_comment:
    types:
      - created

permissions:
  issues: write
  contents: write
  pull-requests: write

jobs:
  infer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest

      - name: Build frontend
        run: bun install --frozen-lockfile && bun run build

      - uses: inference-gateway/infer-action@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          model: anthropic/claude-sonnet-5
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          languages: rust
          apt: libwebkit2gtk-4.1-dev
          bash-allow-append: "cargo( .*)?,rustc( .*)?,rustfmt( .*)?,rustup( .*)?,bun install( .*)?,bun run( .*)?,bun test( .*)?"
