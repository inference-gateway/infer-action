name: Infer Agent (task template overrides)

on:
  workflow_dispatch:
    inputs:
      model:
        description: Model to use (provider/model, e.g. openai/gpt-5)
        required: false
        default: ""
      prompt:
        description: Task for the agent (workflow_dispatch only)
        required: false
        default: ""
      enable_git:
        description: Enable git operations - branch, commit, PR (workflow_dispatch only)
        required: false
        default: "true"
  issues:
    types:
      - opened
  issue_comment:
    types:
      - created

permissions:
  issues: write
  contents: write
  pull-requests: write

jobs:
  infer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/create-github-app-token@v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: inference-gateway/infer-action@main
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          github-app-slug: ${{ steps.app-token.outputs.app-slug }}
          model: ${{ inputs.model || vars.DEFAULT_MODEL }}
          direct-prompt: ${{ inputs.prompt }}
          enable-git-operations: "${{ inputs.enable_git || 'true' }}"
          # These inputs REPLACE the bundled task templates - start from a copy of the
          # bundled ones (src/prompts/task-issue.md, src/prompts/task-pr.md) and edit
          # text/sections, keeping every {{placeholder}}: substitution is strict and an
          # unknown placeholder fails the run. Section placeholders expand to "" when
          # nothing applies, so keep them at the ends of their lines/paragraphs.
          task-issue: |
            Resolve the following GitHub issue.

            Issue #{{issueNumber}}: {{issueTitle}}

            {{issueBody}}{{existingWorkSection}}{{recentCommentsSection}}{{triggeringCommentSection}}

            House rules: follow CONTRIBUTING.md, use Conventional Commits, and run the
            repo's lint and test tasks before every commit.
          # Used for PR conversation comments and submitted reviews only - inline
          # review-comment triggers always use the bundled src/prompts/task-pr-review.md
          # template, which no input overrides. task-direct (direct-prompt runs) is the
          # third template, substituting {{prompt}}.
          task-pr: |
            Continue work on the following pull request.

            PR #{{prNumber}}: {{prTitle}}
            Head branch: {{headRef}} (base: {{baseRef}}){{forkNotice}}

            ## Description

            {{prBody}}{{otherCommentsSection}}

            ## Changed files

            {{diffStatSection}}

            {{ciChecksSection}}

            Run `git diff origin/{{baseRef}}...HEAD` for the full diff and `git log origin/{{baseRef}}..HEAD` for the commit history.{{triggerSection}}

            House rules: follow CONTRIBUTING.md, use Conventional Commits, and run the
            repo's lint and test tasks before every commit.
          llamacpp-api-url: ${{ secrets.LLAMACPP_API_URL }}
          llamacpp-api-key: ${{ secrets.LLAMACPP_API_KEY }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          google-api-key: ${{ secrets.GOOGLE_API_KEY }}
          deepseek-api-key: ${{ secrets.DEEPSEEK_API_KEY }}
          groq-api-key: ${{ secrets.GROQ_API_KEY }}
          mistral-api-key: ${{ secrets.MISTRAL_API_KEY }}
          cloudflare-api-key: ${{ secrets.CLOUDFLARE_API_KEY }}
          cohere-api-key: ${{ secrets.COHERE_API_KEY }}
          ollama-cloud-api-key: ${{ secrets.OLLAMA_CLOUD_API_KEY }}
          moonshot-api-key: ${{ secrets.MOONSHOT_API_KEY }}
          minimax-api-key: ${{ secrets.MINIMAX_API_KEY }}
          nvidia-api-key: ${{ secrets.NVIDIA_API_KEY }}
          zai-api-key: ${{ secrets.ZAI_API_KEY }}
