# Verify locally with the mock gateway (Docker + act): task test:issue - see examples/README.md
name: Infer Agent (custom reminders)

on:
  workflow_dispatch:
    inputs:
      model:
        description: Model to use (provider/model, e.g. openai/gpt-5)
        required: false
        default: ""
      prompt:
        description: Task for the agent (workflow_dispatch only)
        required: false
        default: ""
      enable_git:
        description: Enable git operations - branch, commit, PR (workflow_dispatch only)
        required: false
        default: "true"
  issues:
    types:
      - opened
  issue_comment:
    types:
      - created

permissions:
  issues: write
  contents: write
  pull-requests: write

jobs:
  infer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/create-github-app-token@v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: inference-gateway/infer-action@main
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          github-app-slug: ${{ steps.app-token.outputs.app-slug }}
          model: ${{ inputs.model || vars.DEFAULT_MODEL }}
          direct-prompt: ${{ inputs.prompt }}
          enable-git-operations: "${{ inputs.enable_git || 'true' }}"
          # Your reminders YAML becomes the base of the config the action hands the
          # CLI needs (>= v0.130.0): the action's own reminders are APPENDED to your
          # `reminders:` list, and an entry with the same name REPLACES the action's.
          reminders-config: |
            enabled: true
            # merge: true keeps the CLI's built-in reminders (todo-hygiene, memory);
            # drop the key to replace them with exactly the list below.
            merge: true
            reminders:
              # A brand-new reminder of your own: fires right before every 10th reply.
              - name: house-style
                hook: pre_stream
                trigger: interval
                interval: 10
                text: <system-reminder>Before committing, run the repo's lint and test tasks and fix every failure.</system-reminder>
              # Same name as one of the action's built-ins, so this REPLACES it - it
              # re-states the keep-your-plan-current guidance the built-in carries and
              # adds this repo's house rule. Entry schema: {name, hook, trigger,
              # interval?, threshold?, text} with hooks pre_session, pre_stream,
              # post_stream, pre_tool, post_tool, pre_queue_drain, post_queue_drain,
              # post_session; triggers always, interval, turns_before_max,
              # elapsed_minutes, once, on_failure.
              - name: infer-action-context
                hook: pre_stream
                trigger: interval
                interval: 5
                text: <system-reminder>Keep your TodoWrite plan current. Commit and push after each step so the PR stays current - unpushed work is lost when the run ends. Run the repo's lint and test tasks before every commit.</system-reminder>
          llamacpp-api-url: ${{ secrets.LLAMACPP_API_URL }}
          llamacpp-api-key: ${{ secrets.LLAMACPP_API_KEY }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          google-api-key: ${{ secrets.GOOGLE_API_KEY }}
          deepseek-api-key: ${{ secrets.DEEPSEEK_API_KEY }}
          groq-api-key: ${{ secrets.GROQ_API_KEY }}
          mistral-api-key: ${{ secrets.MISTRAL_API_KEY }}
          cloudflare-api-key: ${{ secrets.CLOUDFLARE_API_KEY }}
          cohere-api-key: ${{ secrets.COHERE_API_KEY }}
          ollama-cloud-api-key: ${{ secrets.OLLAMA_CLOUD_API_KEY }}
          moonshot-api-key: ${{ secrets.MOONSHOT_API_KEY }}
          minimax-api-key: ${{ secrets.MINIMAX_API_KEY }}
          nvidia-api-key: ${{ secrets.NVIDIA_API_KEY }}
          zai-api-key: ${{ secrets.ZAI_API_KEY }}
